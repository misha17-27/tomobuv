; Настройки PHP для сайта. Хостинг с PHP-FPM / FastCGI (обычный cPanel, ISPmanager) подхватывает
; этот файл сам — изменения вступают в силу в течение 5 минут. Если PHP работает как модуль Apache
; (mod_php), файл не читается — задайте те же значения в панели хостинга («Настройки PHP» / «Select PHP Version»).
; Проверить: админка → «Состояние системы» → «Размер загрузки».

; прайсы поставщиков (CSV/XLSX/XML) и фото из админки
upload_max_filesize = 16M
post_max_size = 32M

; импорт больших прайсов, перестройка индекса каталога
memory_limit = 256M
max_execution_time = 120
